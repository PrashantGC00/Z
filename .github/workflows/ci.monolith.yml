name: monolith

on:
  push:
    branches: [main]
    paths: ['backends/monolith/**', 'api/openapi.yaml', 'pnpm-lock.yaml', '.github/workflows/ci.monolith.yml']
  pull_request:
    paths: ['backends/monolith/**', 'api/openapi.yaml', 'pnpm-lock.yaml', '.github/workflows/ci.monolith.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: monolith backend check
    runs-on: ubuntu-latest
    env:
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci
      S3_BUCKET: media
      OTEL_EXPORTER: http://localhost:4318/v1/traces
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter monolith typecheck

      - name: Lint
        run: pnpm --filter monolith lint

      - name: Formatting
        run: pnpm --filter monolith format:check

      - name: Tests
        run: pnpm --filter monolith test

      - name: Build
        run: pnpm --filter monolith build

      - name: Image Build
        run: docker buildx build -f backends/monolith/Dockerfile -t z_monolith .
