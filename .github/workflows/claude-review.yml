# Reviews each pull request as claude[bot], following the /z-review skill. Findings become
# GitHub issues (label claude-review); the PR gets one short summary comment.
# Review only: the bot cannot edit files or push, so backend code stays hand-written
# (README "AI disclosure"). Ask for a re-review by commenting "@claude review again".
name: Claude review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write # findings are filed as issues
  id-token: write
  actions: read # lets Claude read the CI results it links to

jobs:
  review:
    name: Review the pull request
    # Dependabot PRs get no secrets, and drafts aren't ready for review.
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to commit SHAs; the comment says which release that is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. First read CLAUDE.md, the "AI disclosure" section of
            README.md and .claude/skills/z-review/SKILL.md, and follow the skill's modes,
            references, priorities and verification rule. Its report format is replaced by
            the output rules below.

            - Files under backends/, nginx/, Dockerfiles, compose files, migrations and other
              backend infra are TUTOR mode: point at file:line, explain, ask a guiding
              question, and show at most a short snippet (about 15 lines, one idea). Never
              whole files, handlers or ready-to-apply diffs or suggestion blocks.
            - Everything else (frontend/, api/, docs/, root tooling) is fixer mode: a concrete
              fix is fine, as a suggestion only.
            - Don't run the checks; CI runs them. Read them with `gh pr checks`.
            - Get the diff with `gh pr diff`.

            Output rules (keep it short):
            1. Each Blocker or Should-fix finding becomes one GitHub issue. First run
               `gh issue list --label claude-review --state open` and skip any finding already
               filed. Create with
               `gh issue create --label claude-review --title "<file>: <problem>" --body "..."`.
               The body is at most 10 lines: `file:line`, why it matters (1-2 sentences), what
               to look at (a hint, not a fix, in tutor mode), and "Found in #<PR NUMBER>".
            2. Then post ONE PR comment with `gh pr comment`, at most 15 lines:
               - the verdict (Ready / Ready after fixes / Not ready) in one line;
               - one line per issue you created or found already open: `#<n> <title>`;
               - at most 3 one-line "Consider" notes, with no issues for them;
               - the CI result in one line.
               No other sections, no restating the code, no "what's good" list.
            3. No inline comments.
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh issue create:*),Bash(gh issue list:*)"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit"
