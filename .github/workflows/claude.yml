# Answers "@claude" in pull request comments as claude[bot] (questions, re-reviews).
# Answers only: the bot cannot edit files or push, so backend code stays hand-written
# (README "AI disclosure"). Only people with write access can trigger it.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read # lets Claude read CI results on PRs

jobs:
  claude:
    name: Answer @claude
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to commit SHAs; the comment says which release that is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --append-system-prompt "Before answering, read CLAUDE.md and the AI disclosure in README.md. For a review request, follow .claude/skills/z-review/SKILL.md. Under backends/, nginx/ and backend infra you are a tutor: hints, explanations and short snippets (about 15 lines, one idea) only; never whole files, handlers or ready-to-apply diffs. You cannot edit files or push commits; reply in comments. Keep every reply short: at most 15 lines. For a review request, file each Blocker or Should-fix finding as its own issue (check 'gh issue list --label claude-review --state open' first; then 'gh issue create --label claude-review', body at most 10 lines with file:line, why, a hint and the PR number) and reply with only the verdict, one line per issue, at most 3 Consider notes and the CI result."
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh issue create:*),Bash(gh issue list:*)"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit"
